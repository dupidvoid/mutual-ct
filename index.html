<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Chat App</title>
</head>
<body>

    <!-- 1. THE CHAT HTML STRUCTURE -->
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-avatar">💬</div>
            <div>
                <h1 class="header-title">Instant Chat</h1>
                <div class="header-status"><span class="status-dot"></span> Active Room</div>
            </div>
        </div>

        <div id="chat-messages" class="messages-area">
            <div class="system-msg-row">
                <span class="system-msg">Welcome! Type a message or send media below.</span>
            </div>
        </div>

        <div id="gif-picker" class="gif-picker hidden">
            <div class="gif-picker-header">
                <span>Select a GIF</span>
                <button onclick="toggleGifPicker()" class="gif-close-btn">✕</button>
            </div>
            <div class="gif-grid">
                <img src="https://giphy.com" alt="Happy" class="gif-item" onclick="sendGif(this.src)">
                <img src="https://giphy.com" alt="Dance" class="gif-item" onclick="sendGif(this.src)">
                <img src="https://giphy.com" alt="Cat" class="gif-item" onclick="sendGif(this.src)">
                <img src="https://giphy.com" alt="Thumbs Up" class="gif-item" onclick="sendGif(this.src)">
            </div>
        </div>

        <div class="input-bar">
            <input type="file" id="photo-input" accept="image/*" class="hidden-file-input" onchange="handlePhotoUpload(event)">
            <button onclick="triggerPhotoUpload()" class="media-btn" title="Upload Photo">🖼️</button>
            <button onclick="toggleGifPicker()" class="media-btn" title="Send GIF">🎬</button>
            <input type="text" id="message-input" placeholder="Type a message..." class="text-input">
            <button onclick="sendTextMessage()" class="send-btn">➔</button>
        </div>
    </div>

    <!-- 2. THE CSS STYLING SCRIPT -->
    <script>
        (function() {
            const style = document.createElement("style");
            style.textContent = `
                * { box-sizing: border-box; margin: 0; padding: 0; }
                body { background-color: #f1f5f9; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
                .chat-container { width: 100%; max-width: 440px; height: 600px; background-color: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e2e8f0; }
                .chat-header { background-color: #4f46e5; padding: 16px; display: flex; align-items: center; gap: 12px; color: #ffffff; }
                .header-avatar { width: 40px; height: 40px; background-color: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
                .header-title { font-weight: 600; font-size: 18px; }
                .header-status { font-size: 12px; opacity: 0.8; display: flex; align-items: center; gap: 4px; }
                .status-dot { width: 8px; height: 8px; background-color: #4ade80; border-radius: 50%; }
                .messages-area { flex: 1; padding: 16px; overflow-y: auto; background-color: #f8fafc; display: flex; flex-direction: column; gap: 16px; }
                .system-msg-row { display: flex; justify-content: center; }
                .system-msg { background-color: #e2e8f0; color: #475569; font-size: 12px; padding: 4px 12px; border-radius: 9999px; }
                .msg-row { display: flex; justify-content: flex-end; }
                .msg-bubble { background-color: #4f46e5; color: #ffffff; border-radius: 16px; border-top-right-radius: 0px; max-width: 75%; }
                .msg-text { padding: 8px 16px; font-size: 14px; word-break: break-word; }
                .msg-media { padding: 6px; }
                .msg-media img { border-radius: 12px; max-height: 192px; object-fit: cover; width: 100%; display: block; }
                .gif-picker { border-top: 1px solid #e2e8f0; background-color: #ffffff; padding: 12px; max-height: 192px; overflow-y: auto; }
                .gif-picker.hidden { display: none; }
                .gif-picker-header { font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
                .gif-close-btn { border: none; background: none; color: #94a3b8; cursor: pointer; font-weight: bold; }
                .gif-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
                .gif-item { border-radius: 4px; cursor: pointer; height: 64px; width: 100%; object-fit: cover; }
                .input-bar { padding: 12px; background-color: #ffffff; border-top: 1px solid #e2e8f0; display: flex; align-items: center; gap: 8px; }
                .hidden-file-input { display: none; }
                .media-btn { border: none; background: none; padding: 8px; color: #64748b; cursor: pointer; font-size: 18px; }
                .text-input { flex: 1; background-color: #f1f5f9; color: #1e293b; font-size: 14px; padding: 8px 16px; border-radius: 9999px; border: none; outline: none; }
                .send-btn { background-color: #4f46e5; color: #ffffff; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
                ::-webkit-scrollbar { width: 6px; }
                ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
            `;
            document.head.appendChild(style);
        })();
    </script>

    <!-- 3. THE CHAT ENGINE FUNCTIONALITY -->
    <script>
        const chatMessages = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const gifPicker = document.getElementById('gif-picker');
        const photoInput = document.getElementById('photo-input');

        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendTextMessage(); });
        function toggleGifPicker() { gifPicker.classList.toggle('hidden'); }
        function triggerPhotoUpload() { photoInput.click(); }

        function handlePhotoUpload(event) {
            const files = event.target.files;
            if (files && files[0]) {
                const localImageUrl = URL.createObjectURL(files[0]);
                appendMessage(localImageUrl, 'image');
            }
            event.target.value = '';
        }

        function sendGif(url) {
            appendMessage(url, 'gif');
            gifPicker.classList.add('hidden');
        }

        function sendTextMessage() {
            const text = messageInput.value.trim();
            if (text === '') return;
            appendMessage(text, 'text');
            messageInput.value = '';
        }

        function appendMessage(content, type = 'text') {
            const msgWrapper = document.createElement('div');
            msgWrapper.className = 'msg-row';
            const msgBubble = document.createElement('div');
            msgBubble.className = 'msg-bubble';

            if (type === 'text') {
                const textDiv = document.createElement('div');
                textDiv.className = 'msg-text';
                textDiv.innerText = content;
                msgBubble.appendChild(textDiv);
            } else {
                const mediaDiv = document.createElement('div');
                mediaDiv.className = 'msg-media';
                const img = document.createElement('img');
                img.src = content;
                mediaDiv.appendChild(img);
                msgBubble.appendChild(mediaDiv);
            }

            msgWrapper.appendChild(msgBubble);
            chatMessages.appendChild(msgWrapper);
            chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
